<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather & Lightning Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>⛈️ Weather &amp; Lightning Map</h1>
    <div class="controls">
      <input id="search-input" type="text" placeholder="Search a city..." autocomplete="off" />
      <button id="search-btn">Search</button>
      <button id="locate-btn" title="Use my location">📍</button>
    </div>
  </header>

  <main>
    <div id="map"></div>

    <aside id="panel">
      <div id="panel-content">
        <p class="hint">Click anywhere on the map to see current weather for that location.</p>
      </div>
      <div id="lightning-legend">
        <span class="legend-dot"></span> Lightning strikes (last 20 min)
        <span id="lightning-status" class="status-badge status-disconnected">connecting…</span>
      </div>
    </aside>
  </main>

  <footer class="app-footer">
    Weather data: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (no API key required).
    Lightning data: © <a href="https://www.blitzortung.org/" target="_blank" rel="noopener">Blitzortung.org</a>
    community network (CC BY-SA 4.0) — personal, non-commercial use only.
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/lightning.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
