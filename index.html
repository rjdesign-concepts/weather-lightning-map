<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather & Lightning Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main>
    <div id="map"></div>

    <!-- Top-left floating toolbar -->
    <div class="toolbar">
      <div class="input-group">
        <span class="input-group-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input id="search-input" type="text" placeholder="Search location" autocomplete="off" />
      </div>

      <button id="locate-btn" class="icon-btn" title="Use my location" aria-label="Use my location">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/></svg>
      </button>

      <span class="toolbar-separator" aria-hidden="true"></span>

      <div class="toggle-group" role="group" aria-label="Map layers">
        <button type="button" class="toggle-group-item" id="weather-toggle" aria-pressed="true">Weather</button>
        <button type="button" class="toggle-group-item" id="lightning-toggle" aria-pressed="true">Lightning</button>
        <button type="button" class="toggle-group-item" id="aircraft-toggle" aria-pressed="false" title="Live aircraft data isn't wired up yet — this toggle doesn't show anything yet.">Aircraft</button>
      </div>

      <span class="toolbar-separator" aria-hidden="true"></span>

      <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings" aria-haspopup="dialog" aria-controls="settings-modal">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 10.58 4.53 L 10.22 2.67 L 13.78 2.67 L 13.42 4.53 L 16.27 5.71 L 17.34 4.14 L 19.86 6.66 L 18.29 7.73 L 19.47 10.58 L 21.33 10.22 L 21.33 13.78 L 19.47 13.42 L 18.29 16.27 L 19.86 17.34 L 17.34 19.86 L 16.27 18.29 L 13.42 19.47 L 13.78 21.33 L 10.22 21.33 L 10.58 19.47 L 7.73 18.29 L 6.66 19.86 L 4.14 17.34 L 5.71 16.27 L 4.53 13.42 L 2.67 13.78 L 2.67 10.22 L 4.53 10.58 L 5.71 7.73 L 4.14 6.66 L 6.66 4.14 L 7.73 5.71 Z"/>
          <circle cx="12" cy="12" r="3.25"/>
        </svg>
      </button>
    </div>

    <!-- Bottom-left live status pill -->
    <div class="status-pill">
      <span id="status-dot" class="status-dot status-connecting"></span>
      <span id="status-text">Connecting…</span>
    </div>

    <!-- Bottom-right theme toggle + zoom controls -->
    <div class="map-controls">
      <button id="theme-toggle" class="icon-btn floating-btn" title="Switch to dark theme" aria-label="Switch theme">
        <svg id="theme-icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" stroke="none"><path d="M20.5 14.7A8.4 8.4 0 0 1 9.3 3.5a8.7 8.7 0 1 0 11.2 11.2Z"/></svg>
        <svg id="theme-icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" hidden><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.4" y1="4.4" x2="6.1" y2="6.1"/><line x1="17.9" y1="17.9" x2="19.6" y2="19.6"/><line x1="4.4" y1="19.6" x2="6.1" y2="17.9"/><line x1="17.9" y1="6.1" x2="19.6" y2="4.4"/></svg>
      </button>
      <div class="zoom-controls">
        <button id="zoom-in-btn" class="icon-btn" title="Zoom in" aria-label="Zoom in">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><line x1="12" y1="4" x2="12" y2="20"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
        </button>
        <span class="zoom-separator"></span>
        <button id="zoom-out-btn" class="icon-btn" title="Zoom out" aria-label="Zoom out">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><line x1="4" y1="12" x2="20" y2="12"/></svg>
        </button>
      </div>
    </div>

    <!-- Top-right detailed weather card, opened by clicking the map-pin weather pill -->
    <div id="weather-detail" class="weather-detail" hidden>
      <div class="weather-detail-header">
        <div class="weather-detail-title">
          <p class="weather-detail-location" id="weather-detail-location">—</p>
          <p class="weather-detail-description" id="weather-detail-description">—</p>
        </div>
        <button id="weather-detail-close" class="icon-btn" title="Close" aria-label="Close weather detail">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
        </button>
      </div>
      <div class="weather-detail-separator"></div>
      <div class="weather-detail-section">
        <p class="weather-detail-section-label">6-hour forecast</p>
        <div class="weather-detail-row" id="weather-detail-hourly"></div>
      </div>
      <div class="weather-detail-separator"></div>
      <div class="weather-detail-section">
        <p class="weather-detail-section-label">7-day forecast</p>
        <div class="weather-detail-row" id="weather-detail-daily"></div>
      </div>
    </div>
  </main>

  <!-- Settings modal -->
  <div id="settings-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-header">
        <h2 id="settings-title">Settings</h2>
        <button id="settings-close" class="icon-btn" title="Close" aria-label="Close">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
        </button>
      </div>

      <div class="modal-body">
        <label class="field">
          <span>Lightning strike window</span>
          <select id="setting-window">
            <option value="5">Last 5 minutes</option>
            <option value="10">Last 10 minutes</option>
            <option value="20">Last 20 minutes</option>
            <option value="60">Last 60 minutes</option>
          </select>
        </label>

        <label class="field">
          <span>Max strikes shown at once</span>
          <select id="setting-max-markers">
            <option value="100">100</option>
            <option value="300">300</option>
            <option value="1000">1000</option>
            <option value="0">Unlimited</option>
          </select>
        </label>

        <label class="field field-checkbox">
          <input type="checkbox" id="setting-status-badge" />
          <span>Show live connection status</span>
        </label>

        <label class="field">
          <span>Units</span>
          <select id="setting-units">
            <option value="metric">Metric (°C, km/h)</option>
            <option value="imperial">Imperial (°F, mph)</option>
          </select>
        </label>

        <label class="field">
          <span>When the map opens</span>
          <select id="setting-start-location">
            <option value="default">Start at the default view (London)</option>
            <option value="remember">Remember where I left off</option>
            <option value="geolocate">Use my location</option>
          </select>
        </label>
      </div>

      <div class="modal-footer">
        <button id="settings-reset" class="text-btn">Reset to defaults</button>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    Weather data: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (no API key required).
    Lightning data: © <a href="https://www.blitzortung.org/" target="_blank" rel="noopener">Blitzortung.org</a>
    community network (CC BY-SA 4.0) — personal, non-commercial use only.
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/lightning.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
